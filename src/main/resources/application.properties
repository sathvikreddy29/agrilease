spring.application.name=agricultural-land-portal
server.port=8080

# ===================================================================
# Database Configuration (H2 Database)
# ===================================================================

# --- [Default] In-Memory Mode (Resets cleanly on application restart) ---
spring.datasource.url=jdbc:h2:mem:agridb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- [Alternative] Persistent File-based Mode (Uncomment to persist to ./data/agridb) ---
# spring.datasource.url=jdbc:h2:file:./data/agridb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development-Only H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# Security & JWT Configuration
# ===================================================================
# 256-bit secret key for HMAC-SHA256
app.jwt.secret=9a7c8e2b5f1d4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4b
# Token expiration time: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,https://agrilease-sathvikreddy29.vercel.app,https://agrilease.vercel.app,*

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.agri.portal=DEBUG

